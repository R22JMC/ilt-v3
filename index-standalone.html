<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Irish Landmark Trust — v3 Full Site</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="stylesheet" href="https://use.typekit.net/vje6fkm.css">
<style>
/* Irish Landmark Trust — v3 design system
   Brand: PANTONE 357 deep green + PANTONE 486 terracotta + sage / mint / cream
   Type:  Joane Stencil (display) + TT Norms Pro (body, eyebrows, UI)
*/

/* Brand fonts — self-hosted */
@font-face {
  font-family: "Joane Stencil";
  src: url("fonts/JoaneStencilRegular.woff") format("woff");
  font-weight: 400; font-style: normal; font-display: swap;
}
@font-face {
  font-family: "Joane Stencil";
  src: url("fonts/JoaneStencilLight.woff") format("woff");
  font-weight: 300; font-style: normal; font-display: swap;
}
@font-face {
  font-family: "TT Norms Pro";
  src: url("fonts/TTNormsPro-Light.woff") format("woff");
  font-weight: 300; font-style: normal; font-display: swap;
}
@font-face {
  font-family: "TT Norms Pro";
  src: url("fonts/TTNormsPro-Regular.woff") format("woff");
  font-weight: 400; font-style: normal; font-display: swap;
}
@font-face {
  font-family: "TT Norms Pro";
  src: url("fonts/TTNormsPro-Medium.woff") format("woff");
  font-weight: 500; font-style: normal; font-display: swap;
}
:root {
  --green:       #1A5632;
  --green-deep:  #1A3C34;
  --green-mid:   #233B37;
  --sage:        #93A496;
  --sage-light:  #CEDFD7;
  --mint:        #CFDDBB;
  --mint-soft:   #E3EBD2;
  --cream:       #FBF8F6;
  --cream-warm:  #F5EFE7;
  --terracotta:  #EE907B;
  --terracotta-d:#D77A66;
  --ochre:       #E1B77E;
  --beige:       #DCC7B7;
  --ink:         #1A3C34;
  --ink-soft:    #3A4654;
  --line:        #DDDECC;
  --line-warm:   #E8DFD2;

  /* ── Fluid type scale — clamp(min, preferred, max). Min hits ≈360px, max ≈1440px ── */
  --fs-hero:        clamp(2.25rem,  1.45rem + 3.6vw, 5.25rem); /* 36 → 84 */
  --fs-display-xl:  clamp(2.5rem,   1.55rem + 4.25vw, 6rem);   /* 40 → 96 */
  --fs-display-lg:  clamp(2.5rem,   1.7rem + 3.6vw, 5.25rem);  /* 40 → 84 */
  --fs-display-md:  clamp(2.125rem, 1.6rem + 2.35vw, 5rem);    /* 34 → 80 */
  --fs-display-sm:  clamp(2rem,     1.55rem + 2vw, 3.375rem);  /* 32 → 54 */
  --fs-card-name-xl:clamp(2.5rem,   1.6rem + 4vw, 4.75rem);    /* 40 → 76 */
  --fs-card-name:   clamp(2.25rem,  1.65rem + 2.6vw, 3.5rem);  /* 36 → 56 */
  --fs-stat:        clamp(2.75rem,  1.75rem + 4.5vw, 5rem);    /* 44 → 80 */
  --fs-h3:          clamp(1.5rem,   1.15rem + 1.55vw, 2.375rem); /* 24 → 38 */
  --fs-h4:          clamp(1.25rem,  1.05rem + 0.9vw, 1.75rem); /* 20 → 28 */
  --fs-lede:        clamp(1.0625rem,0.95rem + 0.5vw, 1.5rem);  /* 17 → 24 */
  --fs-lede-sm:     clamp(1rem,     0.9rem + 0.45vw, 1.375rem); /* 16 → 22 */
  --fs-body:        clamp(0.9375rem,0.875rem + 0.25vw, 1.0625rem); /* 15 → 17 */
  --fs-intro-sub:   clamp(0.9375rem,0.85rem + 0.4vw, 1.0625rem);  /* 15 → 17 */

  --ease-out: cubic-bezier(.2,.7,.2,1);

  /* Serif used for body-copy ledes/deks (Adobe Fonts / Typekit) */
  --font-serif: "meno-banner", serif;
}

*,*::before,*::after { box-sizing: border-box; }
html,body { margin:0; padding:0; background:var(--cream); color:var(--ink); font-family:"TT Norms Pro", "TT Norms Pro", sans-serif; -webkit-font-smoothing: antialiased; }
body { overflow-x: hidden; }
img { display:block; max-width:100%; }
a { color:inherit; text-decoration:none; cursor:pointer; }
button { font-family:inherit; cursor:pointer; }
::selection { background:var(--terracotta); color:var(--cream); }
summary { cursor:pointer; list-style:none; }
summary::-webkit-details-marker { display:none; }
input, textarea, select { font-family:inherit; }

/* Typography utilities */
.display { font-family:"Joane Stencil", "Joane Stencil", serif; font-weight:400; letter-spacing:-0.02em; line-height:0.98; }
.display em, .di { font-family:"Joane Stencil", "Joane Stencil", serif; font-weight:300; font-weight:300; letter-spacing:-0.025em; }
.eyebrow { font-family:"TT Norms Pro", sans-serif; font-size:12px; letter-spacing:.28em; text-transform:uppercase; font-weight:500; }
.mono { font-family:"TT Norms Pro", sans-serif; }

/* Layout */
.wrap { max-width:1360px; margin:0 auto; padding:0 56px; }
.wrap--narrow { max-width:1040px; margin:0 auto; padding:0 56px; }
.section { padding:140px 0; position:relative; }
.section--sm { padding:90px 0; }

/* Buttons */
.btn {
  display:inline-flex; align-items:center; gap:10px;
  font-family:"TT Norms Pro"; font-size:14px; font-weight:500; letter-spacing:.04em;
  padding:14px 26px; border-radius:0; border:1px solid transparent;
  transition: transform .15s ease, background .15s ease, color .15s ease;
  background:none; text-transform:uppercase; letter-spacing:.08em;
}
.btn:hover { transform: translateY(-1px); }
.btn--accent { background:var(--terracotta); color:#fff; }
.btn--accent:hover { background:var(--terracotta-d); }
.btn--dark { background:var(--green-deep); color:var(--cream); }
.btn--ghost { background:transparent; color:var(--green-deep); border-color:var(--green-deep); }
.btn--ghost:hover { background:var(--green-deep); color:var(--cream); }
.btn--ghost-w { background:transparent; color:var(--cream); border-color:rgba(251,248,246,.5); }
.btn--ghost-w:hover { background:var(--cream); color:var(--green-deep); }
.btn--light { background:var(--cream); color:var(--green-deep); }
.btn--sm { padding:10px 20px; font-size:12px; }
.btn .arr { font-size:14px; }

/* ─── Header + Mega menu ─── */
.header {
  position:fixed; top:0; left:0; right:0; z-index:50;
  padding:20px 0;
  color: var(--cream);
  transition: background .25s ease, color .25s ease, padding .25s ease;
}
.header.is-light { background:var(--cream); color:var(--green-deep); border-bottom:1px solid var(--line-warm); padding:14px 0; }
.header.is-scrolled { background:rgba(26,60,52,.96); backdrop-filter:blur(10px); padding:14px 0; }
.header.is-scrolled.is-light { background:rgba(251,248,246,.96); }
.header .wrap { display:grid; grid-template-columns: auto 1fr auto; align-items:center; gap:32px; max-width:none; padding:0 40px; }
.logo { display:flex; align-items:center; color:inherit; }
.logo__img { display:block; height:64px; width:auto; transition: height .25s ease; }
.header.is-scrolled .logo__img { height:46px; }
.logo__img--footer { height:52px; }
.nav { display:flex; flex:1; gap:40px; justify-content:center; }
.nav button {
  background:none; border:none; color:inherit;
  padding:10px 0; font-family:"TT Norms Pro"; font-size:17px; font-weight:500;
  letter-spacing:.01em; opacity:.9; cursor:pointer; display:flex; align-items:center; gap:7px;
  white-space:nowrap;
}
.nav button:hover { opacity:1; }
.nav button .caret { font-size:11px; opacity:.5; }
.nav button.is-open { opacity:1; }
.nav button.is-open .caret { transform: rotate(180deg); }
.header__cta { display:flex; gap:12px; align-items:center; }
.header__cta .btn { font-size:15px; padding:12px 24px; }

/* Mega menu drop */
.mega {
  position:fixed; left:0; right:0; top:0;
  background:var(--cream); color:var(--ink);
  z-index:49; padding-top:90px;
  box-shadow: 0 30px 80px -30px rgba(26,60,52,.3);
  border-bottom: 1px solid var(--line-warm);
  transform: translateY(-110%); transition: transform .35s cubic-bezier(.2,.7,.2,1);
}
.mega.is-open { transform: translateY(0); }
.mega__inner { display:grid; grid-template-columns: 1.1fr 1fr 1fr 1.3fr; gap:40px; padding:48px 0 56px; }

/* ─── Cascade-in animation when mega opens ─── */
@keyframes mega-cascade {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
.mega__col h5,
.mega__col li,
.mega__feature { opacity: 0; }
.mega.is-open .mega__col h5 {
  animation: mega-cascade .42s cubic-bezier(.2,.7,.2,1) forwards;
  animation-delay: calc(.10s + var(--col, 0) * .04s);
}
.mega.is-open .mega__col li {
  animation: mega-cascade .42s cubic-bezier(.2,.7,.2,1) forwards;
  animation-delay: calc(.18s + var(--col, 0) * .04s + var(--i, 0) * .045s);
}
.mega.is-open .mega__feature {
  animation: mega-cascade .55s cubic-bezier(.2,.7,.2,1) forwards;
  animation-delay: .26s;
}
.mega__col h5 {
  font-family:"TT Norms Pro"; font-size:12px; letter-spacing:.25em; text-transform:uppercase;
  color:var(--terracotta); margin:0 0 18px; font-weight:500;
}
.mega__col ul { list-style:none; padding:0; margin:0; display:grid; gap:22px; }
.mega__col a {
  font-family:"TT Norms Pro", sans-serif; font-size:20px; font-weight:500; color:var(--green-deep);
  line-height:1.35; letter-spacing:0;
  display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
  transition: color .15s ease, padding-left .15s ease;
}
.mega__col a:hover { color:var(--terracotta); padding-left:6px; }
.mega__col a small {
  font-family:"TT Norms Pro"; font-size:12px; font-weight:400; color:var(--sage); opacity:.8;
  letter-spacing:0; text-transform:none;
}
/* Featured callout (image) */
.mega__feature {
  background:var(--mint-soft); border-radius:18px; overflow:hidden;
  display:grid; grid-template-rows: 1fr auto; min-height:260px;
  position:relative;
}
.mega__feature__img { position:relative; height:150px; }
.mega__feature__img img { width:100%; height:100%; object-fit:cover; }
.mega__feature__img::after {
  content:''; position:absolute; inset:0;
  background: linear-gradient(180deg, transparent 50%, rgba(26,60,52,.5));
}
.mega__feature__tag {
  position:absolute; top:14px; left:14px;
  background:var(--terracotta); color:#fff;
  font-family:"TT Norms Pro"; font-size:12px; letter-spacing:.2em; text-transform:uppercase;
  padding:6px 10px; border-radius:999px;
}
.mega__feature__body { padding:20px 22px 22px; }
.mega__feature__body .eyebrow { color:var(--sage); margin-bottom:8px; display:block; }
.mega__feature__body h4 {
  font-family:"Joane Stencil"; font-size:24px; font-weight:400; margin:0 0 12px;
  color:var(--green-deep); line-height:1.1;
}
.mega__feature__body p {
  font-family:"TT Norms Pro"; font-size:14px; line-height:1.55; color:var(--ink-soft); margin:0 0 14px;
}
.mega__feature__body .arr-link {
  font-family:"TT Norms Pro"; font-size:12px; font-weight:600; color:var(--green-deep);
  border-bottom:1px solid var(--green-deep); padding-bottom:2px;
}
.mega__close { position:absolute; right:32px; top:32px; background:none; border:none; font-size:20px; color:var(--ink-soft); cursor:pointer; }

/* Wide feature — spans 2 columns when a group has <3 link columns (e.g. Support & Learn → Saunderscourt).
   Squarer, image-led card with the copy overlaid on a deep-green gradient. */
.mega__feature--wide {
  grid-column: span 2;
  display: block;                 /* drop the rows grid — image fills, body overlays */
  min-height: 300px;
  background: var(--green-deep);
}
.mega__feature--wide .mega__feature__img { position: absolute; inset: 0; height: 100%; }
.mega__feature--wide .mega__feature__img::after {
  background: linear-gradient(180deg, rgba(26,60,52,.05) 0%, rgba(26,60,52,.25) 45%, rgba(26,60,52,.92) 100%);
}
.mega__feature--wide .mega__feature__body {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
  padding: 34px 36px 36px; max-width: 560px; color: var(--cream);
}
.mega__feature--wide .mega__feature__body .eyebrow { color: var(--mint); margin-bottom: 10px; }
.mega__feature--wide .mega__feature__body h4 {
  font-size: 38px; line-height: 1.02; color: var(--cream); margin: 0 0 12px;
}
.mega__feature--wide .mega__feature__body p {
  font-size: 15px; line-height: 1.6; color: rgba(251,248,246,.9); margin: 0 0 18px; max-width: 480px;
}
.mega__feature--wide .mega__feature__body .arr-link { color: var(--cream); border-bottom-color: var(--cream); }

/* Backdrop */
.mega-bd {
  position:fixed; inset:0; background:rgba(26,60,52,.4); z-index:48;
  opacity:0; pointer-events:none; transition: opacity .25s ease;
}
.mega-bd.is-open { opacity:1; pointer-events:auto; }

/* ─── Hero (homepage) — full-bleed ─── */
.hero { position:relative; min-height: clamp(760px, 90vh, 940px); background: var(--green-deep); overflow:hidden; display:flex; flex-direction:column; justify-content:flex-end; }
.hero__bg { position:absolute; inset:0; }
.hero__bg img { width:100%; height:100%; object-fit:cover; object-position:center 40%; filter:saturate(.92) brightness(.95); }
.hero__bg::after {
  content:''; position:absolute; inset:0;
  background: linear-gradient(110deg, rgba(26,60,52,.86) 0%, rgba(26,60,52,.55) 38%, rgba(26,60,52,.05) 65%, rgba(26,60,52,.25) 100%);
}
.hero__content { position:relative; z-index:2; padding: 0 0 40px; color: var(--cream); }
.hero__content .wrap { position: relative; max-width: 1380px; margin: 0 auto; padding: 0 40px; }

/* Late-availability card — bottom-right of the hero */
.late-card {
  position: absolute; right: max(40px, calc((100% - 1380px) / 2 + 40px)); bottom: 40px; width: 326px; z-index: 4;
  background: var(--cream); color: var(--green-deep);
  box-shadow: 0 36px 70px -28px rgba(0,0,0,.5);
  overflow: hidden; transition: transform .35s var(--ease-out), box-shadow .35s var(--ease-out);
}
.late-card:hover { transform: translateY(-4px); box-shadow: 0 44px 80px -30px rgba(0,0,0,.55); }
.late-card__flag {
  display: flex; align-items: center; gap: 9px;
  background: var(--terracotta); color: #fff;
  font-family: "TT Norms Pro"; font-size: 12px; letter-spacing: .18em;
  text-transform: uppercase; font-weight: 500; padding: 9px 16px;
}
.late-card__pulse { width: 8px; height: 8px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 0 rgba(255,255,255,.7); animation: late-pulse 1.8s ease-out infinite; }
@keyframes late-pulse {
  0% { box-shadow: 0 0 0 0 rgba(255,255,255,.7); }
  70% { box-shadow: 0 0 0 7px rgba(255,255,255,0); }
  100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); }
}
.late-card__img { aspect-ratio: 16/9; overflow: hidden; }
.late-card__img img { width: 100%; height: 100%; object-fit: cover; }
.late-card__body { padding: 18px 20px 20px; }
.late-card__dates { font-family: "TT Norms Pro"; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--terracotta-d); font-weight: 500; }
.late-card__name { font-family: "Joane Stencil"; font-size: 25px; font-weight: 400; line-height: 1.04; margin: 8px 0 4px; letter-spacing: -.01em; }
.late-card__loc { font-family: "TT Norms Pro"; font-size: 14px; color: var(--ink-soft); }
.late-card__row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 18px; }
.late-card__price { font-family: "TT Norms Pro"; font-size: 14px; color: var(--ink-soft); }
.late-card__price strong { font-family: "Joane Stencil"; font-weight: 400; font-size: 23px; color: var(--green-deep); margin-left: 2px; }
.hero h1 { margin:24px 0 28px; max-width:780px; font-size: var(--fs-hero); }
.hero h1 em { color:var(--mint); }
.hero__lede {
  font-family: var(--font-serif); font-weight:400; font-style:normal;
  font-size: var(--fs-lede-sm); line-height:1.5; max-width:600px;
  color: rgba(251,248,246,.92); margin:0 0 44px;
  text-wrap: balance;
}
.hero__eyebrow { color: var(--mint); opacity:.95; }

/* Search booking pill */
.search {
  display:grid; grid-template-columns: 1.4fr 1fr auto auto;
  background:var(--cream); color:var(--ink);
  border-radius:999px; padding:6px;
  box-shadow: 0 30px 60px -20px rgba(0,0,0,.35);
  max-width: 780px;
  align-items:center;
}
.search__cell { padding:14px 24px; border-left:1px solid var(--line); }
.search__cell:first-child { border-left:none; }
.search__cell .l { font-family:"TT Norms Pro"; font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--sage); margin-bottom:3px; }
.search__cell .v { font-family:"TT Norms Pro"; font-size:14px; font-weight:500; color:var(--green-deep); }
.search__btn {
  width:60px; height:60px; border-radius:50%; background:var(--terracotta); color:#fff;
  border:none; font-size:22px; align-self:center; justify-self:end;
  margin-left:8px;
}

/* Dog-friendly toggle inside the search pill */
.search__cell--toggle {
  display:flex; align-items:center; gap:12px; cursor:pointer; user-select:none;
  padding:14px 22px;
}
.search__cell--toggle input { position:absolute; opacity:0; pointer-events:none; }
.search__toggle {
  width:36px; height:20px; border-radius:999px;
  background:var(--line); position:relative; flex-shrink:0;
  transition: background .2s ease;
}
.search__toggle .dot {
  position:absolute; top:2px; left:2px;
  width:16px; height:16px; border-radius:50%;
  background:var(--cream); box-shadow:0 1px 3px rgba(0,0,0,.25);
  transition: transform .2s ease;
}
.search__cell--toggle input:checked ~ .search__toggle { background:var(--terracotta); }
.search__cell--toggle input:checked ~ .search__toggle .dot { transform: translateX(16px); }
.search__toggle-label {
  font-family:"TT Norms Pro"; font-size:14px; font-weight:500; color:var(--green-deep);
  white-space:nowrap;
}

/* Trust strip — scrolling marquee in Joane */
.trust { background: var(--mint); color: var(--green-deep); padding: 26px 0; overflow: hidden; }
.trust__track { display: flex; width: max-content; animation: trust-scroll 45s linear infinite; }
.trust__group { display: flex; align-items: center; flex-shrink: 0; }
.trust__item {
  display: inline-flex; align-items: center; padding-right: 72px;
  font-family: "Joane Stencil"; font-weight: 400;
  font-size: clamp(1.5rem, 1rem + 1.8vw, 2.375rem); /* ~24 → 38px */
  letter-spacing: -.01em; line-height: 1; white-space: nowrap;
}
@keyframes trust-scroll {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }
}
@media (prefers-reduced-motion: reduce) {
  .trust__track { animation: none; }
}

/* Intro pattern */
.intro { display:block; margin-bottom:56px; }
.intro > div:first-child:empty { display:none; }
.intro .eyebrow { display:inline-block; margin-bottom:14px; }
.intro h2 { margin:0; font-size: var(--fs-display-md); max-width:900px; }
.intro__sub { font-family:"TT Norms Pro"; font-size: var(--fs-intro-sub); line-height:1.7; color:var(--ink-soft); margin:22px 0 0; max-width:640px; }

/* Pillars — expanding panels with video background on hover */
.pillars { display:flex; gap:24px; align-items:stretch; }
.pillar {
  flex: 1 1 0; min-width: 0;
  background:var(--cream-warm);
  padding:48px 44px 44px; min-height:440px;
  display:flex; flex-direction:column;
  position:relative; overflow:hidden;
  transition: flex-grow .55s var(--ease-out);
  cursor: pointer;
}
.pillar:hover { flex-grow: 2.4; }

/* Video background — hidden by default, fades + Ken-Burns drift on hover */
.pillar__video {
  position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
  opacity:0; transform: scale(1.06); z-index:0;
  transition: opacity .6s ease, transform 7s ease;
}
.pillar:hover .pillar__video { opacity:1; transform: scale(1.14); }

/* Dark-green overlay so text stays legible over video */
.pillar__overlay {
  position:absolute; inset:0; z-index:1; pointer-events:none;
  background: linear-gradient(180deg, rgba(26,60,52,.62) 0%, rgba(26,60,52,.84) 100%);
  opacity:0; transition: opacity .6s ease;
}
.pillar:hover .pillar__overlay { opacity:1; }

.pillar__content { position:relative; z-index:2; display:flex; flex-direction:column; flex:1; }
.pillar__num {
  font-family:"Joane Stencil"; font-weight:300; font-size:80px; color:var(--sage);
  line-height:.9; position:absolute; right:36px; top:32px; opacity:.4; z-index:2;
  transition: color .45s ease, opacity .45s ease;
}
.pillar__eyebrow { color: var(--terracotta); transition: color .4s ease; }
.pillar h3 { font-family:"Joane Stencil"; font-size: var(--fs-h3); line-height:1.05; font-weight:400; margin:16px 0 14px; letter-spacing:-.01em; transition: color .4s ease; }
.pillar h3 em { font-weight:300; color:var(--green); transition: color .4s ease; }
.pillar p { font-family:"TT Norms Pro"; font-size: var(--fs-body); line-height:1.65; color:var(--ink-soft); margin:0 0 28px; flex:1; transition: color .4s ease; }
.pillar__link { font-family:"TT Norms Pro"; font-size:14px; font-weight:600; color:var(--green-deep); border-bottom:1px solid var(--green-deep); padding-bottom:3px; align-self:flex-start; letter-spacing:.02em; transition: color .3s ease, border-color .3s ease, padding-left .25s var(--ease-out); }

/* Hover — switch text to light over the dark-green video overlay */
.pillar:hover .pillar__num { color: rgba(251,248,246,.3); opacity:1; }
.pillar:hover .pillar__eyebrow { color: var(--mint); }
.pillar:hover h3 { color: var(--cream); }
.pillar:hover h3 em { color: var(--mint); }
.pillar:hover p { color: rgba(251,248,246,.92); }
.pillar:hover .pillar__link { color: var(--cream); border-color: var(--cream); padding-left: 6px; }

/* Labour / mission teaser */
.labour { background: var(--mint-soft); padding: 160px 0; position:relative; overflow:hidden; }
.labour::before { content:''; position:absolute; left:-200px; top:-200px; width:560px; height:560px; border-radius:50%; background: radial-gradient(circle at 50% 50%, var(--mint) 0%, transparent 65%); opacity:.7; }
.labour .wrap { display:grid; grid-template-columns: 1fr 1fr; gap:100px; align-items:center; position:relative; z-index:1; }
.labour h2 { font-size: var(--fs-display-lg); line-height:.95; margin:18px 0 28px; }
.labour h2 em { font-weight:300; color:var(--green); font-weight:300; }
.labour__copy p { font-family:"TT Norms Pro"; font-size: var(--fs-body); line-height:1.75; color:var(--ink-soft); margin:0 0 18px; }
.labour__copy p.lead { font-family: var(--font-serif); font-weight:400; font-style:normal; font-size: var(--fs-lede-sm); line-height:1.5; color:var(--green-deep); }

.collage { position:relative; height:560px; }
.collage img { position:absolute; border-radius:12px; box-shadow: 0 30px 60px -30px rgba(26,60,52,.4); object-fit:cover; }
.collage .a { left:0; top:0; width:300px; height:380px; }
.collage .b { right:0; bottom:0; width:340px; height:280px; border:8px solid var(--cream); }
.collage__scribble { position:absolute; left:-40px; top:-30px; width:200px; opacity:.6; z-index:0; }

/* Asymmetric categories grid */
.cats { display:grid; grid-template-columns: 1.4fr 1fr 1fr; grid-template-rows: 320px 320px; gap:20px; }
.cat { position:relative; border-radius:18px; overflow:hidden; cursor:pointer; background:#ccc; }
.cat img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transition: transform .6s ease; }
.cat:hover img { transform: scale(1.06); }
.cat::after { content:''; position:absolute; inset:0; background: linear-gradient(180deg, transparent 35%, rgba(26,60,52,.75)); }
.cat__label { position:absolute; left:28px; bottom:24px; right:28px; z-index:2; color:var(--cream); }
.cat__count { font-family:"TT Norms Pro"; font-size:12px; letter-spacing:.25em; text-transform:uppercase; opacity:.85; }
.cat__name { font-family:"Joane Stencil"; font-weight:300; font-weight:300; font-size: var(--fs-h3); margin-top:6px; line-height:.95; letter-spacing:-.015em; }
.cat--big { grid-row: 1 / 3; }
.cat--big .cat__name { font-size: clamp(2.375rem, 1.55rem + 3.7vw, 3.75rem); }

/* Featured properties grid */
.featured { background:#E1E4DC; padding: 140px 0; }
.featured .intro h2 { color:var(--green-deep); }
.props { display:grid; grid-template-columns: repeat(4, 1fr); gap:24px; }
.prop {
  background:var(--cream); border-radius:16px; overflow:hidden;
  box-shadow: 0 8px 24px -16px rgba(26,60,52,.2);
  transition: transform .2s ease, box-shadow .2s ease;
  cursor:pointer; text-decoration:none; color:inherit;
}
.prop:hover { transform: translateY(-4px); box-shadow: 0 30px 50px -20px rgba(26,60,52,.3); }
.prop__img { aspect-ratio: 4/3; position:relative; overflow:hidden; background:var(--sage-light); }
.prop__img img { width:100%; height:100%; object-fit:cover; }
.prop__tag { position:absolute; top:14px; left:14px; background:rgba(251,248,246,.95); color:var(--green-deep); font-family:"TT Norms Pro"; font-size:12px; letter-spacing:.2em; text-transform:uppercase; padding:6px 10px; border-radius:999px; }
.prop__dog { position:absolute; top:14px; right:14px; background:rgba(26,60,52,.8); color:var(--cream); font-family:"TT Norms Pro"; font-size:12px; letter-spacing:.2em; text-transform:uppercase; padding:6px 10px; border-radius:999px; backdrop-filter:blur(4px); }
.prop__body { padding:20px 22px 24px; }
.prop__row { display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
.prop__name { font-family:"Joane Stencil"; font-size:24px; font-weight:500; letter-spacing:-.01em; line-height:1.1; margin:0; }
.prop__price { font-family:"TT Norms Pro"; font-size:12px; color:var(--ink-soft); white-space:nowrap; }
.prop__loc { font-family:"TT Norms Pro"; font-size:14px; color:var(--ink-soft); margin-top:4px; }
.prop__meta { font-family:"TT Norms Pro"; font-size:12px; letter-spacing:.15em; text-transform:uppercase; color:var(--sage); margin-top:14px; padding-top:14px; border-top:1px solid var(--line); display:flex; gap:14px; }

/* Mission / stats band */
.mission { background: var(--green-deep); color: var(--cream); padding: 160px 0; position:relative; overflow:hidden; }
.mission .wrap { display:grid; grid-template-columns: 1.3fr 1fr; gap:80px; align-items:center; position:relative; z-index:1; }

/* Zoomed-in topographic contour lines (decorative, animated) */
.topo {
  position:absolute; top:50%; right:-12%; transform:translateY(-50%);
  width:min(900px, 80%); height:140%; z-index:0; pointer-events:none;
  color: var(--mint);
}
/* Entrance: emanate (grow + fade) when scrolled into view */
.topo__wrap {
  transform-box: fill-box; transform-origin: center;
  transform: scale(.5); opacity: 0;
  transition: transform 1.5s var(--ease-out), opacity 1s ease;
}
.topo.is-visible .topo__wrap { transform: scale(1); opacity: 1; }
/* Continuous drift once present */
.topo__g {
  transform-box: fill-box; transform-origin: center;
  animation: topo-drift 75s ease-in-out infinite;
}
.topo use {
  fill:none; stroke: currentColor; stroke-width:1.5;
  vector-effect: non-scaling-stroke;
  opacity: 0; transition: opacity .8s ease; transition-delay: calc(var(--i, 0) * .14s);
}
.topo.is-visible use { opacity:.22; }
/* Labour-section variant — green lines on the light band, always visible */
.topo--labour { left:-10%; right:auto; top:50%; transform:translateY(-50%); width:min(680px,52%); height:130%; color:var(--green); }
.topo--labour use { opacity:.13; }
.topo--labour .topo__g { transform-box: fill-box; transform-origin: center; animation: topo-drift 80s ease-in-out infinite; }
@keyframes topo-drift {
  0%   { transform: rotate(0deg)  scale(1); }
  50%  { transform: rotate(9deg)  scale(1.1); }
  100% { transform: rotate(0deg)  scale(1); }
}
@media (prefers-reduced-motion: reduce) {
  .topo__g { animation: none; }
  .topo__wrap { transform: none; opacity: 1; transition: none; }
  .topo use { opacity: .18; transition: none; }
}
.mission h2 { font-size: var(--fs-display-xl); line-height:.95; margin:18px 0 28px; }
.mission h2 em { font-weight:300; color:var(--mint); font-weight:300; }
.mission__lede { font-family: var(--font-serif); font-weight:400; font-style:normal; font-size: var(--fs-lede-sm); line-height:1.55; opacity:.85; max-width:540px; margin:0 0 48px; }
.mission__stats { display:grid; grid-template-columns: repeat(3, 1fr); gap:32px; margin:0 0 48px; }
.stat__n { font-family:"Joane Stencil"; font-weight:300; font-weight:300; font-size: var(--fs-stat); line-height:1; color:var(--terracotta); letter-spacing:-.02em; }
.stat__l { font-family:"TT Norms Pro"; font-size:12px; letter-spacing:.25em; text-transform:uppercase; opacity:.7; margin-top:10px; }
.mission__cta { display:flex; gap:14px; }
.mission__img { position:relative; aspect-ratio: 4/5; overflow:visible; }
.mission__img img { width:100%; height:100%; object-fit:cover; }
.mission__badge { position:absolute; left:-32px; bottom:48px; background:var(--terracotta); color:#fff; padding:16px 22px; border-radius:999px; font-family:"Joane Stencil"; font-weight:300; font-size:20px; font-weight:400; box-shadow: 0 18px 30px -10px rgba(0,0,0,.35); }

/* Stories */
.stories { padding: 160px 0; }
.stories__grid { display:grid; grid-template-columns: 1fr 1fr 1fr; gap:32px; align-items:start; }
.story { cursor:pointer; text-decoration:none; color:inherit; }
.story__img { aspect-ratio: 4/5; border-radius:14px; overflow:hidden; background:var(--sage-light); }

.story__img img { width:100%; height:100%; object-fit:cover; transition: transform .5s ease; }
.story:hover .story__img img { transform: scale(1.05); }
.story__meta { font-family:"TT Norms Pro"; font-size:12px; letter-spacing:.25em; text-transform:uppercase; color:var(--sage); margin-top:20px; }
.story h3 { font-family:"Joane Stencil"; font-size: var(--fs-h4); font-weight:400; line-height:1.2; margin:10px 0 0; letter-spacing:-.01em; }

/* Gift Vouchers — image + floating voucher card + denomination chips */
.gift { background: var(--cream-warm); padding: 110px 0; position:relative; overflow:hidden; }
.gift__inner { display:grid; grid-template-columns: 1fr 1fr; gap:72px; align-items:center; }

}
.gift__voucher__row { display:flex; justify-content:space-between; align-items:center; }

.gift__voucher__foot { font-family:"TT Norms Pro"; font-size:12px; line-height:1.5; color:var(--ink-soft); border-top:1px dashed var(--line); padding-top:12px; }
.gift__body h2 { font-family:"Joane Stencil"; font-size: var(--fs-display-md); line-height:1; margin:12px 0 16px; font-weight:400; letter-spacing:-.01em; }

.gift__body p { font-family:"TT Norms Pro"; font-size:16px; line-height:1.65; color:var(--ink-soft); max-width:480px; margin:0; }
.gift__amounts { display:flex; gap:10px; flex-wrap:wrap; margin:26px 0 30px; }
.gift__chip {
  padding:11px 20px; border:1px solid var(--green-deep); border-radius:0; background:none;
  font-family:"TT Norms Pro"; font-size:14px; font-weight:500; color:var(--green-deep); cursor:pointer;
  transition: background .15s ease, color .15s ease;
}
.gift__chip:hover, .gift__chip.is-active { background:var(--green-deep); color:var(--cream); }

/* Donate banner */
.donateband { background: var(--green-deep); color: var(--cream); padding: 110px 0; text-align:center; }
.donateband h2 { font-family:"Joane Stencil"; font-size: var(--fs-display-md); font-weight:400; line-height:1.02; margin:14px auto 18px; max-width:900px; }
.donateband h2 em { color: var(--mint); font-weight:300; }
.donateband p { font-family:"TT Norms Pro"; font-size:17px; line-height:1.6; max-width:600px; margin:0 auto 28px; opacity:.85; }

/* Newsletter band */
.newsband { background: var(--cream-warm); padding: 80px 0; }
.newsband__inner { display:grid; grid-template-columns: 1fr 1fr; gap:48px; align-items:center; }
.newsband h2 { font-family:"Joane Stencil"; font-size: var(--fs-display-sm); line-height:1.02; margin:10px 0 14px; font-weight:400; letter-spacing:-.01em; }
.newsband h2 em { font-weight:300; }
.newsband p { font-family:"TT Norms Pro"; font-size:16px; line-height:1.6; color:var(--ink-soft); max-width:480px; margin:0; }
.duo__consent { font-family:"TT Norms Pro"; font-size:12px; color:var(--ink-soft); margin-top:16px; }
.newsletter { display:flex; background:var(--cream); border-radius:0; padding:4px; border:1px solid var(--line); max-width:440px; }
.newsletter input { flex:1; background:none; border:none; outline:none; padding:14px 22px; font-family:"TT Norms Pro"; font-size:14px; color:var(--ink); }
.newsletter button { background:var(--green-deep); color:var(--cream); border:none; padding:14px 22px; border-radius:0; font-family:"TT Norms Pro"; font-size:14px; font-weight:500; cursor:pointer; text-transform:uppercase; letter-spacing:.08em; }

/* Footer */
footer.f { background: var(--green-deep); color: var(--cream); padding: 90px 0 16px; position:relative; overflow:hidden; }
.f .wrap { position: relative; z-index: 1; }

.f__top { display:grid; grid-template-columns: 1fr 1fr 1fr 1.15fr; gap:48px; padding-bottom:56px; border-bottom:1px solid rgba(255,255,255,.08); }
.f h4 { font-family:"TT Norms Pro"; font-size:12px; letter-spacing:.25em; text-transform:uppercase; opacity:.55; margin:0 0 22px; font-weight:500; }
.f ul { list-style:none; padding:0; margin:0; display:grid; gap:14px; }
.f a { font-family:"TT Norms Pro"; font-size:14px; opacity:.85; cursor:pointer; }
.f a:hover { opacity:1; }
/* Support Our Work box */
.f__support { background: rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.12); padding:26px 28px; align-self:start; }
.f__support h5 { font-family:"Joane Stencil"; font-weight:400; font-size:24px; margin:0 0 10px; color:var(--cream); }
.f__support p { font-family:"TT Norms Pro"; font-size:14px; line-height:1.6; opacity:.8; margin:0 0 18px; }
.f__bottom { display:flex; justify-content:space-between; align-items:center; padding:24px 0 36px; font-family:"TT Norms Pro"; font-size:12px; letter-spacing:.14em; text-transform:uppercase; opacity:.6; }
.f__bottom a { cursor:pointer; }
.socials { display:flex; gap:18px; }
.socials a { font-family:"TT Norms Pro"; font-size:12px; letter-spacing:.18em; opacity:.85; }
.socials a:hover { opacity:1; }

/* PageTop with a right-aligned action */
.page-top__inner { display:flex; justify-content:space-between; align-items:flex-end; gap:40px; }
.page-top__action { flex-shrink:0; padding-bottom:8px; }

/* Property image → gallery affordance */
.prop__img { cursor: zoom-in; }
.prop__gallery {
  position:absolute; bottom:12px; right:12px; z-index:2;
  background:rgba(26,60,52,.82); color:var(--cream); backdrop-filter:blur(4px);
  font-family:"TT Norms Pro"; font-size:11px; letter-spacing:.12em; text-transform:uppercase;

  transition:opacity .2s ease, transform .2s ease; pointer-events:none;
}

/* Lightbox gallery */
.lightbox { position:fixed; inset:0; z-index:120; background:rgba(26,60,52,.93); display:grid; place-items:center; padding:40px; }
.lightbox__close { position:absolute; top:24px; right:30px; background:none; border:none; color:var(--cream); font-size:30px; cursor:pointer; line-height:1; }

.lightbox__stage img { width:100%; max-height:78vh; object-fit:contain; display:block; }
.lightbox__nav { position:absolute; top:50%; transform:translateY(-50%); background:rgba(251,248,246,.14); border:none; color:var(--cream); width:54px; height:54px; font-size:26px; cursor:pointer; transition:background .15s ease; }

/* Map view */

}
.ireland-map .badge { position:absolute; left:18px; bottom:18px; font-family:"TT Norms Pro"; font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--green-deep); opacity:.7; }
.map-pin { position:absolute; transform:translate(-50%, -100%); cursor:pointer; z-index:2; }
.map-pin__dot { width:14px; height:14px; border-radius:50%; background:var(--green-deep); border:2px solid var(--cream); box-shadow:0 2px 8px rgba(0,0,0,.25); }

.map-pin__tip { position:absolute; bottom:24px; left:50%; transform:translateX(-50%); background:var(--green-deep); color:var(--cream); padding:8px 12px; border-radius:6px; white-space:nowrap; box-shadow:0 8px 20px rgba(0,0,0,.25); font-family:"TT Norms Pro"; font-size:12px; }

.map-list-item h4 { font-family:"Joane Stencil"; font-size:17px; font-weight:500; margin:0; line-height:1.15; }
.map-list-item .meta { font-family:"TT Norms Pro"; font-size:12px; letter-spacing:.1em; color:var(--sage); margin-top:4px; text-transform:uppercase; }
.map-list-item .price { font-family:"TT Norms Pro"; font-size:12px; color:var(--terracotta); }

/* Generic grid layouts for property listings on inner pages */

.props--list .prop { display:grid; grid-template-columns: 300px 1fr auto; }
.props--list .prop__img { aspect-ratio: 4/3; }
.props--list .prop__body { padding: 26px 32px; }

/* Property detail */
.pd-gallery { display:grid; grid-template-columns:2fr 1fr 1fr; grid-template-rows: 240px 240px; gap:8px; }
.pd-gallery > *:first-child { grid-row: 1 / 3; }

.tabs { display:flex; gap:0; border-bottom:1px solid var(--line-warm); margin-bottom:28px; }
.tab { padding:14px 20px; background:none; border:none; font-family:"TT Norms Pro"; font-size:12px; font-weight:500; letter-spacing:.15em; text-transform:uppercase; color:var(--sage); cursor:pointer; border-bottom:3px solid transparent; margin-bottom:-1px; transition: color .2s ease, border-color .2s ease; }

  position:sticky; top:100px;
}

.book-rail__price .n { font-family:"Joane Stencil"; font-size:42px; font-weight:400; }
.book-rail__price .u { font-family:"TT Norms Pro"; font-size:12px; color:var(--sage); }
.book-rail__dates { display:grid; grid-template-columns: 1fr 1fr; border:1px solid var(--line); border-radius:10px; overflow:hidden; margin:18px 0 10px; }
.book-rail__dates > div { padding:12px 14px; }
.book-rail__dates > div:first-child { border-right:1px solid var(--line); }
.book-rail__dates .l { font-family:"TT Norms Pro"; font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--sage); }
.book-rail__dates .v { font-family:"TT Norms Pro"; font-size:14px; font-weight:500; margin-top:2px; }

/* Availability calendar */
.cal-grid { background:var(--cream); border:1px solid var(--line-warm); border-radius:14px; overflow:hidden; }
.cal-grid__header, .cal-grid__row { display:grid; grid-template-columns: 240px 1fr; align-items:center; padding:10px 18px; gap:10px; }
.cal-grid__header { background:var(--cream-warm); font-family:"TT Norms Pro"; font-size:12px; letter-spacing:.15em; text-transform:uppercase; color:var(--sage); }
.cal-grid__row { border-top:1px solid var(--line-warm); cursor:pointer; }
.cal-grid__row:hover { background:var(--cream-warm); }
.cal-days { display:grid; grid-template-columns: repeat(31, 1fr); gap:2px; }
.cal-day { aspect-ratio: 1/1.6; border-radius:2px; }
.cal-day--open { background:var(--mint); }
.cal-day--partial { background:var(--ochre); }
.cal-day--booked { background:var(--line-warm); }

/* Project / Saunderscourt */
.timeline { display:grid; grid-template-columns: repeat(5, 1fr); gap:4px; background:var(--line-warm); border:1px solid var(--line-warm); border-radius:14px; overflow:hidden; }
.timeline > div { background:var(--cream); padding:24px 22px; min-height:200px; }
.timeline .yr { font-family:"Joane Stencil"; font-weight:300; font-size:42px; font-weight:300; color:var(--terracotta); }
.timeline .t { font-family:"TT Norms Pro"; font-size:12px; letter-spacing:.15em; text-transform:uppercase; margin:10px 0; color:var(--green-deep); }
.timeline .c { font-family:"TT Norms Pro"; font-size:14px; line-height:1.6; color:var(--ink-soft); }

.fund-stripe { background:var(--green-deep); color:var(--cream); padding:18px 0; position:sticky; top:70px; z-index:25; }
.fund-stripe .wrap { display:grid; grid-template-columns: 1fr auto auto; gap:24px; align-items:center; }
.fund-bar { display:flex; align-items:center; gap:14px; margin-top:6px; }
.fund-bar .amt { font-family:"Joane Stencil"; font-size:24px; }
.fund-bar .track { flex:1; min-width:200px; max-width:360px; height:6px; background:rgba(255,255,255,.1); border-radius:99px; overflow:hidden; }
.fund-bar .track > div { height:100%; background:var(--terracotta); border-radius:99px; }
.fund-bar .goal { font-family:"TT Norms Pro"; font-size:12px; opacity:.6; }

/* Donor recognition */
.donor-row { display:grid; grid-template-columns: 140px 140px 1fr; gap:14px; padding:16px 0; border-bottom:1px solid var(--line-warm); align-items:center; }
.donor-row .tier { font-family:"Joane Stencil"; font-size:20px; font-weight:500; }
.donor-row .band { font-family:"TT Norms Pro"; font-size:12px; color:var(--sage); }
.donor-row .listed { font-family:"TT Norms Pro"; font-size:14px; color:var(--ink-soft); }

/* Generic content grid */
.two-col { display:grid; grid-template-columns: 1fr 2fr; gap:72px; }
.two-col h2 { margin:14px 0 0; font-size:46px; }

/* FAQ accordion */
/* FAQ — rule-divided, smooth height animation */
.faq { background:none; border:none; border-bottom:1px solid var(--line-warm); padding:0; margin:0; }
.faq__q {
  width:100%; background:none; border:none; cursor:pointer; padding:22px 0; gap:24px;
  display:flex; justify-content:space-between; align-items:center; text-align:left;
  font-family: var(--font-serif); font-weight:400; font-size:22px; line-height:1.25; color:var(--green-deep);
}
.faq__q .plus { color:var(--terracotta); font-size:22px; transition:transform .25s ease; flex-shrink:0; }
.faq.is-open .faq__q .plus { transform:rotate(45deg); }
.faq__wrap { display:grid; grid-template-rows:0fr; transition:grid-template-rows .35s var(--ease-out); }
.faq.is-open .faq__wrap { grid-template-rows:1fr; }
.faq__wrap > .faq__body { overflow:hidden; min-height:0; }
.faq__body { font-family:"TT Norms Pro"; font-size:15px; line-height:1.7; color:var(--ink-soft); }
.faq.is-open .faq__body { padding-bottom:22px; }

/* Team grid */
.team-grid { display:grid; grid-template-columns: repeat(3, 1fr); gap:32px; }
.team-card .ph { aspect-ratio: 4/5; border-radius:14px; overflow:hidden; background:var(--sage-light); }
.team-card h4 { font-family:"Joane Stencil"; font-size:24px; font-weight:500; margin:16px 0 4px; }
.team-card .role { font-family:"TT Norms Pro"; font-size:14px; color:var(--ink-soft); }
.team-card .more { font-family:"TT Norms Pro"; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--terracotta); margin-top:6px; }

/* Page-specific helpers */
.split-cta { background:var(--green-deep); color:var(--cream); border-radius:18px; padding:48px 56px; display:grid; grid-template-columns: 2fr auto; gap:32px; align-items:center; }
.split-cta h3 { font-family:"Joane Stencil"; font-size:38px; font-weight:400; margin:10px 0 0; line-height:1.05; }

.policy-grid { display:grid; grid-template-columns: 1fr 1fr; gap:14px; }
.policy-card { background:var(--cream-warm); border:1px solid var(--line-warm); border-radius:14px; padding:24px 28px; display:grid; grid-template-columns: 1fr auto; gap:20px; align-items:center; }
.policy-card h4 { font-family:"Joane Stencil"; font-size:22px; font-weight:500; margin:0 0 6px; }
.policy-card p { font-family:"TT Norms Pro"; font-size:14px; color:var(--ink-soft); margin:0; }

/* Wireframe-ish accents (subtle) */
.scribble { stroke:var(--green); fill:none; stroke-width:1.5px; stroke-linecap:round; }

/* ─── Categories index — editorial grid with parallax + hover reveal ─── */
.cat-section { padding: 100px 0 240px; overflow: hidden; position: relative; }
.cat-cards {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  column-gap: 32px;
  row-gap: 64px;
  align-items: start;
}
.cat-card {
  position: relative; display: block; overflow: hidden; cursor: pointer;
  color: var(--cream); text-decoration: none;
  will-change: transform;
  /* No transition on transform — JS drives parallax every frame */
}
.cat-card__img { position: absolute; inset: 0; overflow: hidden; background: var(--green-deep); }
.cat-card__img img {
  width: 100%; height: 100%; object-fit: cover;
  transition: transform 1.2s cubic-bezier(.2,.7,.2,1), filter .6s ease;
  filter: saturate(.92);
}
.cat-card:hover .cat-card__img img { transform: scale(1.06); filter: saturate(1); }

/* Base shade — soft bottom gradient so name is always legible */
.cat-card__shade {
  position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(180deg, rgba(26,60,52,0) 35%, rgba(26,60,52,.55) 75%, rgba(26,60,52,.9) 100%);
  mix-blend-mode: multiply;
  transition: opacity .5s ease;
}
/* Hover shade — full deep-green multiply for blurb legibility */
.cat-card__shade--hover {
  background:
    linear-gradient(180deg, rgba(26,60,52,.55) 0%, rgba(26,60,52,.85) 100%),
    linear-gradient(180deg, rgba(26,60,52,.45) 0%, rgba(26,60,52,.45) 100%);
  opacity: 0;
}
.cat-card:hover .cat-card__shade--hover { opacity: 1; }

.cat-card__inner {
  position: relative; z-index: 2;
  height: 100%;
  padding: 32px 36px 36px;
  display: flex; flex-direction: column; justify-content: space-between;
  color: var(--cream);
}
.cat-card__top { display: flex; }
.cat-card__count {
  font-family: "TT Norms Pro"; font-size: 12px; letter-spacing: .25em;
  text-transform: uppercase; font-weight: 500;
  background: rgba(251,248,246,.18); backdrop-filter: blur(6px);
  padding: 7px 14px; border-radius: 999px;
  border: 1px solid rgba(251,248,246,.25);
}
.cat-card__name {
  font-family: "Joane Stencil"; font-weight: 400; line-height: .98;
  letter-spacing: -.015em; margin: 0;
  text-shadow: 0 2px 16px rgba(0,0,0,.35);
  font-size: var(--fs-card-name);
}
.cat-card--wide .cat-card__name { font-size: var(--fs-card-name-xl); }
.cat-card--narrow .cat-card__name { font-size: var(--fs-card-name); }

/* Hover-reveal blurb + cta */
.cat-card__reveal {
  max-height: 0; opacity: 0; overflow: hidden; margin-top: 0;
  transition: max-height .55s cubic-bezier(.2,.7,.2,1), opacity .35s ease .05s, margin-top .55s cubic-bezier(.2,.7,.2,1);
}
.cat-card:hover .cat-card__reveal { max-height: 240px; opacity: 1; margin-top: 16px; }
.cat-card__blurb {
  font-family: "TT Norms Pro"; font-size: 15px; line-height: 1.6;
  margin: 0 0 18px; max-width: 460px; color: rgba(251,248,246,.94);
}
.cat-card__cta {
  display: inline-block; font-family: "TT Norms Pro"; font-size: 14px;
  font-weight: 600; letter-spacing: .04em;
  border-bottom: 1px solid var(--cream); padding-bottom: 4px;
}

/* ─── Booking calendar (property detail) ─── */
.bcal { background: var(--cream); border: 1px solid var(--line-warm); overflow: hidden; }
.bcal__head { background: var(--green-deep); color: var(--cream); font-family: "Joane Stencil"; font-weight: 400; font-size: 20px; padding: 14px 18px; }
.bcal__body { padding: 16px 16px 18px; }
.bcal__nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; }
.bcal__arrow { background: none; border: none; cursor: pointer; font-size: 22px; line-height: 1; color: var(--sage); padding: 4px 8px; transition: color .15s ease; }
.bcal__arrow:hover { color: var(--green-deep); }
.bcal__select { position: relative; flex: 1; }
.bcal__select select {
  -webkit-appearance: none; appearance: none; width: 100%; cursor: pointer;
  background: var(--cream); border: 1px solid var(--line); color: var(--green-deep);
  font-family: "TT Norms Pro"; font-size: 15px; font-weight: 500;
  padding: 10px 32px 10px 14px; border-radius: 0;
}
.bcal__caret { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--sage); font-size: 12px; }
.bcal__grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.bcal__dow { margin-bottom: 4px; }
.bcal__dow span { text-align: center; font-family: "TT Norms Pro"; font-size: 12px; color: var(--sage); padding: 4px 0; }
.bcal__cell {
  aspect-ratio: 1/1; display: grid; place-items: center; border: none; background: none;
  font-family: "TT Norms Pro"; font-size: 14px; color: var(--ink); cursor: pointer;
  border-radius: 50%; position: relative; transition: background .15s ease, color .15s ease;
}
.bcal__cell--empty { cursor: default; }
.bcal__cell.is-past { color: var(--line); cursor: default; }
.bcal__cell.is-booked { color: var(--sage); cursor: not-allowed; text-decoration: line-through; opacity: .6; }
.bcal__cell.is-avail { color: var(--green-deep); font-weight: 500; }
.bcal__cell.is-avail:hover { background: var(--mint-soft); }
/* range band */
.bcal__cell.is-range { background: var(--cream-warm); border-radius: 0; }
/* selected endpoints */
.bcal__cell.is-sel { background: var(--green-deep); color: var(--cream); font-weight: 600; border-radius: 50%; z-index: 1; }
.bcal__cell.is-start { box-shadow: -8px 0 0 0 var(--cream-warm); }
.bcal__cell.is-end { box-shadow: 8px 0 0 0 var(--cream-warm); }
.bcal__cell.is-start.is-end { box-shadow: none; }
.bcal__cta {
  display: block; width: 100%; margin-top: 16px; cursor: pointer;
  background: var(--green-deep); color: var(--cream); border: none;
  font-family: "Joane Stencil"; font-weight: 400; font-size: 19px;
  padding: 13px 18px; transition: background .2s ease;
}
.bcal__cta:hover { background: var(--green); }

/* ─── Article / blog post template ─── */
.article-hero { padding: 150px 0 8px; background: var(--cream); }
.article-hero .crumb a { cursor: pointer; }
.article-hero .crumb a:hover { color: var(--terracotta); }
.article-hero h1 {
  font-family: "Joane Stencil"; font-weight: 400; letter-spacing: -.02em;
  line-height: 1.02; margin: 14px 0 22px; max-width: 900px;
  font-size: var(--fs-display-md);
}
.article-dek {
  font-family: var(--font-serif); font-weight: 400; font-style: normal; line-height: 1.45;
  color: var(--ink-soft); max-width: 720px; margin: 0 0 34px;
  font-size: var(--fs-lede);
}
.article-byline { display: flex; align-items: center; gap: 14px; }
.article-byline__av { width: 46px; height: 46px; border-radius: 50%; background: var(--sage-light); flex-shrink: 0; }
.article-byline__name { font-family: "TT Norms Pro"; font-size: 15px; font-weight: 600; color: var(--green-deep); }
.article-byline__meta { font-family: "TT Norms Pro"; font-size: 13px; color: var(--sage); margin-top: 2px; }
.article-figure { margin: 40px auto 0; max-width: 1040px; aspect-ratio: 16/9; overflow: hidden; }
.article-figure img { width: 100%; height: 100%; object-fit: cover; }

.article-body { max-width: 720px; margin: 0 auto; padding: 56px 24px 90px; }
.article-body p { font-family: "TT Norms Pro"; font-size: 18px; line-height: 1.78; color: var(--ink); margin: 0 0 24px; }
.article-body p.lead-para { font-family: var(--font-serif); font-weight: 400; font-size: 22px; line-height: 1.55; color: var(--green-deep); margin-bottom: 32px; }
.article-body h2 { font-family: "Joane Stencil"; font-size: 32px; font-weight: 400; line-height: 1.12; letter-spacing: -.01em; margin: 48px 0 18px; }
.article-body blockquote {
  margin: 44px 0; padding: 6px 0 6px 30px; border-left: 3px solid var(--terracotta);
  font-family: "Joane Stencil"; font-weight: 300; font-size: 27px; line-height: 1.35; color: var(--green-deep);
}
.article-body ul { margin: 0 0 24px; padding-left: 22px; }
.article-body li { font-family: "TT Norms Pro"; font-size: 18px; line-height: 1.7; color: var(--ink); margin-bottom: 10px; }
.article-cta { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 44px; padding-top: 36px; border-top: 1px solid var(--line-warm); }

/* ─── Sharp-edged cards (pills, buttons, circles stay rounded) ─── */
.mega__feature,
.pillar,
.cat,
.prop,
.story__img,
.mission__img,
.ireland-map,
.map-list-item,
.map-list-item__img,
.pd-gallery img,
.book-rail,
.book-rail__dates,
.cal-grid,
.cal-day,
.timeline,
.faq,
.team-card .ph,
.split-cta,
.policy-card,
.collage img,
.cat-card { border-radius: 0; }

/* ═════════════════════════════════════════════════════════════════════════════
   RESPONSIVE
   ═════════════════════════════════════════════════════════════════════════════ */

/* ── Mobile drawer + hamburger (visible only below 900px) ── */
.nav-toggle {
  display: none;
  width: 44px; height: 44px;
  background: none; border: none; cursor: pointer; padding: 0;
  flex-direction: column; gap: 5px; align-items: center; justify-content: center;
  color: inherit;
}
.nav-toggle span {
  display: block; width: 24px; height: 2px; background: currentColor;
  transition: transform .25s ease, opacity .25s ease;
}
.mobile-bd {
  position: fixed; inset: 0; background: rgba(26,60,52,.5);
  z-index: 55; opacity: 0; pointer-events: none;
  transition: opacity .25s ease;
}
.mobile-bd.is-open { opacity: 1; pointer-events: auto; }
.mobile-drawer {
  position: fixed; top: 0; right: 0; bottom: 0;
  width: 88%; max-width: 420px;
  background: var(--cream); color: var(--green-deep);
  z-index: 60; transform: translateX(100%);
  transition: transform .35s cubic-bezier(.2,.7,.2,1);
  display: flex; flex-direction: column;
  overflow-y: auto;
}
.mobile-drawer.is-open { transform: translateX(0); }
.mobile-drawer__head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 20px; border-bottom: 1px solid var(--line-warm); flex-shrink: 0;
}
.mobile-drawer__head .x {
  background: none; border: none; font-size: 26px; cursor: pointer;
  color: var(--green-deep); width: 44px; height: 44px; line-height: 1;
}
.mobile-drawer__body { padding: 8px 20px 32px; }
.m-group { border-bottom: 1px solid var(--line-warm); }
.m-group > button {
  width: 100%; padding: 22px 0; background: none; border: none;
  font-family: "Joane Stencil"; font-size: 22px; font-weight: 400;
  color: var(--green-deep); display: flex; justify-content: space-between;
  align-items: center; cursor: pointer; letter-spacing: -.01em;
}
.m-group > button .car { font-size: 12px; transition: transform .2s ease; opacity:.6; }
.m-group.is-open > button .car { transform: rotate(180deg); }
.m-group__body {
  max-height: 0; overflow: hidden;
  transition: max-height .4s cubic-bezier(.2,.7,.2,1);
}
.m-group.is-open .m-group__body { max-height: 1200px; }
.m-group__body > div { padding: 6px 0 16px; }
.m-group__body h5 {
  font-family: "TT Norms Pro"; font-size: 12px; letter-spacing: .25em;
  text-transform: uppercase; color: var(--terracotta);
  margin: 6px 0 12px; font-weight: 500;
}
.m-group__body ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
.m-group__body a {
  font-family: "TT Norms Pro"; font-size: 15px; font-weight: 500;
  color: var(--green-deep); cursor: pointer;
}
.m-cta { padding: 24px 0 8px; display: grid; gap: 10px; }
.m-cta .btn { justify-content: center; }

/* ─── Laptop / small desktop (≤1180px) ─── */
@media (max-width: 1180px) {
  .wrap, .wrap--narrow { padding: 0 32px; }
  .props { grid-template-columns: repeat(3, 1fr); }
  .props--3 { grid-template-columns: repeat(2, 1fr); }
  .pd-main { gap: 48px; }
  .mega__inner { grid-template-columns: 1fr 1fr 1fr 1.2fr; gap: 28px; }
}

/* ─── Tablet (≤900px) ─── */
@media (max-width: 900px) {
  /* swap desktop nav for hamburger */
  .nav { display: none; }
  .header__cta .btn--ghost { display: none; }   /* hide Gift Vouchers, keep Book Now */
  .nav-toggle { display: flex; }
  .header .wrap { gap: 16px; grid-template-columns: auto 1fr auto; padding: 0 28px; }
  .hero__content .wrap { padding: 0 28px; }
  .mega, .mega-bd { display: none !important; }  /* desktop mega menu hidden */

  .section { padding: 80px 0; }
  .section--sm { padding: 60px 0; }

  /* Hero */
  .hero { min-height: 600px; display: block; }
  .hero__content { padding: 130px 0 80px; }
  .hero__lede { margin-bottom: 32px; }
  .late-card { display: none; }   /* desktop flourish only */

  /* Search pill: stack the cells, full-width button */
  .search {
    grid-template-columns: 1fr;
    border-radius: 16px; padding: 8px;
    max-width: 100%;
  }
  .search__cell {
    border-left: none; border-top: 1px solid var(--line);
    padding: 12px 18px;
  }
  .search__cell:first-child { border-top: none; }
  .search__cell--toggle { justify-content: flex-start; }
  .search__btn {
    width: 100%; height: 52px; border-radius: 999px;
    justify-self: stretch; margin: 4px 0 0;
  }

  /* Trust marquee */
  .trust { padding: 18px 0; }

  /* Intro + pillars */
  .intro { grid-template-columns: 1fr; gap: 16px; margin-bottom: 48px; }
  /* Pillars stack on tablet; expand-on-hover disabled, video shows always */
  .pillars { flex-direction: column; gap: 18px; }
  .pillar { flex: none; min-height: 300px; padding: 36px 32px; }
  .pillar:hover { flex: none; }

  /* Labour */
  .labour { padding: 90px 0; }
  .labour .wrap { grid-template-columns: 1fr; gap: 56px; }
  .collage { height: 420px; max-width: 480px; }
  .collage .a { width: 260px; height: 320px; }
  .collage .b { width: 280px; height: 220px; }

  /* Categories (home) */
  .cats { grid-template-columns: 1fr 1fr; grid-template-rows: auto; gap: 14px; }
  .cat { height: 280px; }
  .cat--big { grid-row: auto; }

  /* Featured property grid */
  .featured { padding: 80px 0; }
  .props { grid-template-columns: repeat(2, 1fr); }

  /* Mission */
  .mission { padding: 90px 0; }
  .mission .wrap { grid-template-columns: 1fr; gap: 48px; }
  .mission__stats { gap: 20px; margin-bottom: 36px; }

  /* Stories — flatten the stagger on tablet */
  .stories { padding: 90px 0; }
  .stories__grid { grid-template-columns: 1fr 1fr; gap: 24px; }
  .stories__grid > :nth-child(3) { display: none; }
  .stories__grid > * .story__img,
  .stories__grid > :nth-child(2) .story__img,
  .stories__grid > :nth-child(3) .story__img { aspect-ratio: 4/3; margin-top: 0; }

  /* Duo split */
  .duo { grid-template-columns: 1fr; min-height: auto; }
  .duo__news, .duo__gift { padding: 64px 36px; }

  /* Footer */
  .f__top { grid-template-columns: 1fr 1fr; gap: 40px; }
  .newsband__inner { grid-template-columns: 1fr; gap: 28px; }
  .gift__inner { grid-template-columns: 1fr; gap: 56px; }
  .gift__voucher { left: 16px; width: 260px; }

  /* Inner pages */
  .page-top { padding: 130px 0 60px; }
  .page-top__inner { flex-direction: column; align-items: flex-start; gap: 40px; }
  .page-top__action { padding-bottom: 0; }

  /* Properties listing — map + list stack */
  .map-row { grid-template-columns: 1fr; }
  .ireland-map { height: 480px; }
  .map-list { max-height: none; }
  .filterbar { top: 60px; }
  .filterbar .wrap { gap: 8px; }
  .pill { padding: 8px 14px; font-size: 12px; }

  /* Property detail */
  .pd-main { grid-template-columns: 1fr; gap: 40px; }
  .book-rail { position: static; }
  .pd-gallery {
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 220px 180px 180px;
  }
  .pd-gallery > *:first-child { grid-row: 1; grid-column: 1 / 3; }
  .pd-quick { flex-wrap: wrap; gap: 18px 24px; }

  /* Two-col text grid */
  .two-col { grid-template-columns: 1fr; gap: 32px; }

  /* Project timeline */

/* ── Body scroll lock when mobile drawer is open ── */
body.no-scroll { overflow: hidden; }

/* ─── Preloader — fast image flicker, then wipes up to reveal the hero ─── */
.preloader {
  position: fixed; inset: 0; z-index: 200; background: var(--green-deep); overflow: hidden;
  clip-path: inset(0 0 0 0); will-change: clip-path;
  transition: clip-path 1.6s var(--ease-out);
}
.preloader.is-wipe { clip-path: inset(0 0 100% 0); }   /* mask wipes up from the bottom */
.preloader__frame {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 54vh; height: 72vh; overflow: hidden;          /* portrait card */
}
.preloader__frame img {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; object-position: center 40%;
  filter: saturate(.92) brightness(.95);
  opacity: 0; transition: opacity .14s ease;
}
.preloader__frame img.is-active { opacity: 1; }

/* Hero background fades in as the wipe reveals it */
.hero__bg img { opacity: 0; transition: opacity 1.2s ease; }
.is-loaded .hero__bg img { opacity: 1; }

/* ─── Page-load cascade (triggered by .is-loaded, set when hero is revealed) ─── */
/* Nav drops in */
.header { transform: translateY(-100%); }
.is-loaded .header { transform: translateY(0); transition: transform .8s var(--ease-out), background .25s ease, color .25s ease, padding .25s ease; }

/* Hero copy rises line by line, then search + late card */
.hero__line { display: block; overflow: hidden; }
.hero__line > span { display: block; transform: translateY(118%); }
.hero__eyebrow, .hero .search { opacity: 0; }
.late-card { opacity: 0; }

.is-loaded .hero__line > span { transform: translateY(0); animation: rise-in .9s var(--ease-out) backwards; }
.is-loaded .hero__title .hero__line:nth-child(1) > span { animation-delay: .26s; }
.is-loaded .hero__title .hero__line:nth-child(2) > span { animation-delay: .40s; }
.is-loaded .hero__eyebrow { opacity: 1; animation: fade-up .8s var(--ease-out) .12s backwards; }
.is-loaded .hero__lede { animation: fade-up .8s var(--ease-out) .56s backwards; }
.is-loaded .hero .search { opacity: 1; animation: fade-up .8s var(--ease-out) .70s backwards; }
.is-loaded .late-card { opacity: 1; animation: slide-left .9s var(--ease-out) .92s backwards; }

@keyframes rise-in   { from { transform: translateY(118%); } to { transform: translateY(0); } }
@keyframes fade-up   { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slide-left{ from { opacity: 0; transform: translateX(70px); } to { opacity: 1; transform: translateX(0); } }

@media (prefers-reduced-motion: reduce) {
  .preloader { transition: none; }
  .preloader__frame { transition: none; }
  .header { transform: none; }
  .hero__bg img { opacity: 1; }
  .hero__line > span { transform: none; }
  .hero__eyebrow, .hero .search, .late-card { opacity: 1; }
  .is-loaded .hero__line > span,
  .is-loaded .hero__eyebrow, .is-loaded .hero__lede,
  .is-loaded .hero .search, .is-loaded .late-card { animation: none; }
}

/* ═════════════════════════════════════════════════════════════════════════════
   NATURAL CARD HOVER INTERACTIONS
   Slow image zoom, gentle lift, content cues. Disabled on touch (see @media hover).
   ═════════════════════════════════════════════════════════════════════════════ */
@media (hover: hover) {

}

// ─── Preloader — fast image flicker → last image zooms into the hero bg ──────
// Ordered so the final frame is p1.jpg, which is also the hero background.
function Preloader() {
  const imgs = ['p2','p3','p4','p5','p6','p7','p8','p1'].map(n => `assets/stays/${n}.jpg`);
  const [idx, setIdx] = useState(0);
  const [phase, setPhase] = useState('flicker'); // flicker → zoom → reveal → gone

  useEffect(() => {
    document.body.classList.add('no-scroll');
    const FLICK = 160;
    let i = 0;
    const iv = setInterval(() => {
      i++;
      if (i >= imgs.length - 1) {
        clearInterval(iv);
        setIdx(imgs.length - 1);
        setTimeout(() => {                                          // wipe up + reveal hero
          setPhase('wipe');
          document.documentElement.classList.add('is-loaded');      // bg fade + element cascade
        }, FLICK + 240);
        setTimeout(() => {                                          // overlay removed
          setPhase('gone'); document.body.classList.remove('no-scroll');
        }, FLICK + 240 + 1650);
      } else setIdx(i);
    }, FLICK);
    return () => { clearInterval(iv); document.body.classList.remove('no-scroll'); };
  }, []);

  if (phase === 'gone') return null;

  return (
    <div className={'preloader' + (phase === 'wipe' ? ' is-wipe' : '')}>
      <div className="preloader__frame">
        {imgs.map((src, i) => <img key={i} src={src} alt="" className={i === idx ? 'is-active' : ''}/>)}
      </div>
    </div>
  );
}

<script type="text/babel" data-presets="env,react">
// v3 Pages — listings, category, multi-property, property detail, availability, your-stay, faqs
const {useState:uS, useMemo:uM} = React;

const IMGS = ['assets/img-1.jpg','assets/img-2.jpg','assets/img-3.jpg','assets/img-4.jpg','assets/img-5.jpg','assets/img-6.jpg','assets/hero-lighthouse.jpg'];
const pick = (id, off=0) => IMGS[(id.charCodeAt(0) + id.length + off) % IMGS.length];

// ─── Booking calendar (property detail) ─────────────────────────────────────
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW = ['Mo','Tu','We','Th','Fr','Sa','Su'];
const dayKey = (d) => d.getFullYear()*10000 + d.getMonth()*100 + d.getDate();

function BookingCalendar({ propId, name, onBook }) {
  const today = new Date(); today.setHours(0,0,0,0);
  const [view, setView] = uS(new Date(today.getFullYear(), today.getMonth(), 1));
  const [start, setStart] = uS(null);
  const [end, setEnd] = uS(null);

  const y = view.getFullYear(), m = view.getMonth();
  const startWeekday = (new Date(y, m, 1).getDay() + 6) % 7;   // Monday-first
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const seed = (propId || '').charCodeAt(0) || 7;

  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(new Date(y, m, d));

  const isPast = (d) => d < today;
  // deterministic "booked" days so it looks like real availability
  const isBooked = (d) => !isPast(d) && ((d.getDate() * seed) % 11 === 0);
  const isAvail = (d) => !isPast(d) && !isBooked(d);
  const same = (a, b) => a && b && dayKey(a) === dayKey(b);
  const inRange = (d) => start && end && d > start && d < end;

  const pickDay = (d) => {
    if (!isAvail(d)) return;
    if (!start || (start && end)) { setStart(d); setEnd(null); }
    else if (dayKey(d) <= dayKey(start)) { setStart(d); }
    else { setEnd(d); }
  };

  // months to offer in the dropdown: this month → +13
  const opts = [];
  for (let i = 0; i < 14; i++) { const dt = new Date(today.getFullYear(), today.getMonth() + i, 1); opts.push(dt); }

  const nights = start && end ? Math.round((end - start) / 86400000) : 0;
  const label = !start ? 'Select start date' : !end ? 'Select end date' : `Request ${nights} night${nights>1?'s':''} →`;

  return (
    <div className="bcal">
      <div className="bcal__head">{name}</div>
      <div className="bcal__body">
        <div className="bcal__nav">
          <button type="button" className="bcal__arrow" aria-label="Previous month" onClick={()=>setView(new Date(y, m-1, 1))}>‹</button>
          <div className="bcal__select">
            <select value={y*100+m} onChange={(e)=>{ const v=+e.target.value; setView(new Date(Math.floor(v/100), v%100, 1)); }}>
              {opts.map(dt => <option key={dayKey(dt)} value={dt.getFullYear()*100+dt.getMonth()}>{MONTH_NAMES[dt.getMonth()]} {dt.getFullYear()}</option>)}
            </select>
            <span className="bcal__caret">▾</span>
          </div>
          <button type="button" className="bcal__arrow" aria-label="Next month" onClick={()=>setView(new Date(y, m+1, 1))}>›</button>
        </div>
        <div className="bcal__grid bcal__dow">{DOW.map(d => <span key={d}>{d}</span>)}</div>
        <div className="bcal__grid">
          {cells.map((d, i) => d === null
            ? <span key={i} className="bcal__cell bcal__cell--empty"/>
            : <button key={i} type="button" disabled={!isAvail(d)}
                className={['bcal__cell',
                  isPast(d) ? 'is-past' : (isBooked(d) ? 'is-booked' : 'is-avail'),
                  (same(d,start)||same(d,end)) ? 'is-sel' : '',
                  inRange(d) ? 'is-range' : '',
                  same(d,start) ? 'is-start' : '', same(d,end) ? 'is-end' : ''
                ].filter(Boolean).join(' ')}
                onClick={()=>pickDay(d)}>{d.getDate()}</button>
          )}
        </div>
        <button type="button" className="bcal__cta" onClick={()=> (start && end) ? onBook(start, end) : null}>{label}</button>
      </div>
    </div>
  );
}

// ─── Property image gallery lightbox ────────────────────────────────────────
function PropGallery({ p, onClose }) {
  const imgs = [0,1,2,3,4].map(o => pick(p.id, o));
  const [i, setI] = uS(0);
  const prev = () => setI(v => (v - 1 + imgs.length) % imgs.length);
  const next = () => setI(v => (v + 1) % imgs.length);
  React.useEffect(() => {
    document.body.classList.add('no-scroll');
    const onKey = (e) => { if (e.key === 'Escape') onClose(); if (e.key === 'ArrowLeft') prev(); if (e.key === 'ArrowRight') next(); };
    window.addEventListener('keydown', onKey);
    return () => { document.body.classList.remove('no-scroll'); window.removeEventListener('keydown', onKey); };
  }, []);
  return (
    <div className="lightbox" onClick={onClose}>
      <button className="lightbox__close" onClick={onClose} aria-label="Close">✕</button>
      <div className="lightbox__stage" onClick={e=>e.stopPropagation()}>
        <button className="lightbox__nav lightbox__nav--prev" onClick={prev} aria-label="Previous">‹</button>
        <img src={imgs[i]} alt={p.name}/>
        <button className="lightbox__nav lightbox__nav--next" onClick={next} aria-label="Next">›</button>
        <div className="lightbox__cap">{p.name} · {i+1} / {imgs.length}</div>
      </div>
    </div>
  );
}

const CAT_IMG = {
  'lighthouses':  'assets/hero-lighthouse.jpg',
  'romantic':     'assets/img-6.jpg',
  'dog-friendly': 'assets/img-3.jpg',
  'groups':       'assets/img-2.jpg',

};

function CategoriesIndexV3({ setPage }) {
  const D = window.ILT_DATA;
  const wrapRef = React.useRef(null);

  React.useEffect(() => {
    const root = wrapRef.current;
    if (!root) return;
    const cards = root.querySelectorAll('.cat-card');
    let raf = null;
    const tick = () => {
      raf = null;
      const vh = window.innerHeight;
      const isMobile = window.innerWidth < 900;
      cards.forEach(card => {
        if (isMobile) { card.style.transform = ''; return; }
        const speed = parseFloat(card.dataset.speed || '0');
        const rect = card.getBoundingClientRect();
        const center = rect.top + rect.height / 2;
        const offset = (vh / 2 - center) * speed;
        card.style.transform = `translateY(${offset.toFixed(1)}px)`;
      });
    };
    const onScroll = () => { if (!raf) raf = requestAnimationFrame(tick); };
    tick();
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll, { passive: true });
    return () => {
      window.removeEventListener('scroll', onScroll);
      window.removeEventListener('resize', onScroll);
      if (raf) cancelAnimationFrame(raf);
    };
  }, []);

  // Editorial layout: 12-col grid, varied spans, heights, and parallax speeds
  const LAYOUTS = [
    { span:'wide',   col:'1 / 8',  h:680, speed:-0.06, mt: 0   },
    { span:'narrow', col:'8 / 13', h:520, speed: 0.10, mt: 80  },
    { span:'narrow', col:'1 / 6',  h:560, speed: 0.08, mt: 40  },
    { span:'wide',   col:'6 / 13', h:720, speed:-0.07, mt: 0   },
    { span:'narrow', col:'1 / 7',  h:580, speed:-0.09, mt: 20  },
    { span:'narrow', col:'7 / 13', h:640, speed: 0.05, mt: 60  },
  ];

  return (
    <div>
      <PageTop
        crumb="Explore & Stay"
        eyebrow="Six curated collections"
        title={<>Browse by <em className="di">collection</em>.</>}
        lede="Pick the trip you want. Lighthouses on wild coasts, gate lodges built for two, country houses for the whole party — every collection is a different way into 33 restored heritage stays."
      />
      <section className="cat-section">
        <div className="wrap">
          <div className="cat-cards" ref={wrapRef}>
            {D.categories.map((c, i) => {
              const isItinerary = c.id === 'itineraries';
              const l = LAYOUTS[i % LAYOUTS.length];
              return (
                <a key={c.id}
                  className={'cat-card cat-card--' + l.span}
                  data-speed={l.speed}
                  style={{ gridColumn: l.col, height: l.h, marginTop: l.mt }}
                  onClick={() => setPage(isItinerary ? 'stories' : 'category', isItinerary ? {} : { categoryId: c.id })}>
                  <div className="cat-card__img"><img src={CAT_IMG[c.id]} alt={c.name}/></div>
                  <div className="cat-card__shade"/>
                  <div className="cat-card__shade cat-card__shade--hover"/>
                  <div className="cat-card__inner">
                    <div className="cat-card__top">
                      <span className="cat-card__count">{c.count} {isItinerary ? 'routes' : 'properties'}</span>
                    </div>
                    <div className="cat-card__bottom">
                      <h3 className="cat-card__name">{c.name}</h3>
                      <div className="cat-card__reveal">
                        <p className="cat-card__blurb">{c.blurb}</p>
                        <span className="cat-card__cta">{isItinerary ? 'Read the itineraries →' : 'Browse the collection →'}</span>
                      </div>
                    </div>
                  </div>
                </a>
              );
            })}
          </div>
        </div>
      </section>
    </div>
  );
}

<script type="text/babel" data-presets="env,react">
// ─── Hash router ─────────────────────────────────────────────────────────────
// URL pattern:  #/page            (e.g. #/properties)
//               #/page/slug       (e.g. #/category/lighthouses)
// The slug populates the appropriate param key per route.
const PARAM_KEY = {
  category: 'categoryId',
  multi:    'parentId',
  property: 'id',
  project:  'projectId',
  story:    'slug',
};

function hashToRoute(hash) {
  const path = (hash || '').replace(/^#\/?/, '');
  if (!path) return { page: 'home', params: {} };
  const [page, slug] = path.split('/');
  const key = PARAM_KEY[page];
  const params = key && slug ? { [key]: decodeURIComponent(slug) } : {};
  return { page, params };
}
function routeToHash({ page, params }) {
  if (page === 'home') return '#/';
  const key = PARAM_KEY[page];
  const slug = key ? params[key] : '';
  return slug ? `#/${page}/${encodeURIComponent(slug)}` : `#/${page}`;
}

function App() {
  const [route, setRoute] = React.useState(() => hashToRoute(window.location.hash));

  // Listen for browser back/forward + manual hash changes
  React.useEffect(() => {
    const onHash = () => setRoute(hashToRoute(window.location.hash));
    window.addEventListener('hashchange', onHash);
    // Normalise a bare '#' or empty hash on first load
    if (!window.location.hash) window.history.replaceState(null, '', '#/');
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  React.useEffect(() => { window.scrollTo({top:0, behavior:'instant'}); }, [route]);

  const setPage = (page, params = {}) => {
    const nextHash = routeToHash({ page, params });
    if (window.location.hash === nextHash) {
      setRoute({ page, params });               // same URL → still re-render
    } else {
      window.location.hash = nextHash;          // triggers hashchange → setRoute
    }
  };
  const openProp = (id) => setPage('property', { id });

  const isHome = route.page === 'home';
  const headerTransparent = isHome;

  const pages = {
    home: <HomeV3 setPage={setPage} openProp={openProp}/>,
    properties: <PropertiesPageV3 setPage={setPage} openProp={openProp}/>,
    categories: <CategoriesIndexV3 setPage={setPage}/>,
    category: <CategoryPageV3 categoryId={route.params.categoryId} setPage={setPage} openProp={openProp}/>,
    multi: <MultiPageV3 parentId={route.params.parentId} setPage={setPage} openProp={openProp}/>,
    property: <PropertyDetailV3 id={route.params.id} setPage={setPage} openProp={openProp}/>,
    availability: <AvailabilityPageV3 setPage={setPage} openProp={openProp}/>,
    stay: <YourStayV3 setPage={setPage}/>,
    faqs: <FAQsPageV3/>,
    projects: <ProjectsPageV3 setPage={setPage}/>,
    project: <ProjectDetailV3 projectId={route.params.projectId} setPage={setPage}/>,
    about: <AboutPageV3 setPage={setPage}/>,
    team: <TeamPageV3/>,
    governance: <GovernancePageV3/>,
    donate: <DonatePageV3 setPage={setPage}/>,
    gift: <GiftPageV3/>,
    contact: <ContactPageV3/>,
    stories: <StoriesPageV3 setPage={setPage}/>,
    story: <StoryDetailV3 slug={route.params.slug} setPage={setPage}/>,
    learn: <LearnPageV3/>,
  };

  const key = route.page + JSON.stringify(route.params);

  return (
    <div data-screen-label={'ILT v3 · ' + route.page}>
      <Preloader/>
      <HeaderV3 setPage={setPage} openProp={openProp} transparent={headerTransparent}/>
      <main key={key}>{pages[route.page] || pages.home}</main>
      <FooterV3 setPage={setPage}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
